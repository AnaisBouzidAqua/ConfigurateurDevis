name: tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: configurateur_devis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # 8.4 et non 8.3 : des dépendances Symfony transitives (via
          # composer.lock) exigent PHP >= 8.4.1. C'est aussi la version cible
          # de l'infra AquaConnect.
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # `composer setup` installe les deps, génère la clé, joue les migrations
      # (contre le Postgres du service ci-dessus) et construit le front —
      # ça valide déjà que l'appli se monte à froid depuis le seul dépôt git.
      - name: Setup Application
        run: composer setup
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: configurateur_devis
          DB_USERNAME: postgres
          DB_PASSWORD: password

      # Les tests tournent sur SQLite en mémoire (phpunit.xml), indépendamment
      # du Postgres ci-dessus.
      - name: Run tests
        run: php artisan test
